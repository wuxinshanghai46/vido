  <rect x="0" y="70" width="226" height="930" fill="#0C1218"/>
  <line x1="226" y1="70" x2="226" y2="1000" stroke="#1E2933"/>
  <g class="ui">
    <text x="26" y="112" class="quiet small" font-weight="700">工作区</text>
