    <circle cx="36" cy="156" r="10" fill="#173128"/><path d="M31 156l3 3 7-7" fill="none" stroke="#66F4B3" stroke-width="2"/>
    <text x="58" y="161" class="muted body">参考与目标</text>

    <rect x="14" y="188" width="198" height="50" rx="10" fill="#14271F" stroke="#2D7357"/>
