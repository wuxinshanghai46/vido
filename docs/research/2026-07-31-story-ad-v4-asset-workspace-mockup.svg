    <text x="26" y="511" class="muted small">产品</text><text x="164" y="511" class="green small">1 / 1</text>
    <text x="26" y="542" class="muted small">场景</text><text x="164" y="542" fill="#F1BD6C" class="small">2 / 3</text>
    <text x="26" y="573" class="muted small">镜头</text><text x="164" y="573" class="quiet small">0 / 8</text>

