<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090D12"/>
      <stop offset="1" stop-color="#101821"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#233B39"/>
      <stop offset="1" stop-color="#101B21"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#526B74"/>
      <stop offset=".55" stop-color="#1F3941"/>
      <stop offset="1" stop-color="#0D171C"/>
    </linearGradient>
    <linearGradient id="tunnel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#51452F"/>
      <stop offset=".55" stop-color="#21272A"/>
      <stop offset="1" stop-color="#0A0D10"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <style>
      .ui{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}
      .muted{fill:#84919E}
      .quiet{fill:#5E6A75}
      .white{fill:#F2F6F8}
      .green{fill:#66F4B3}
      .small{font-size:13px}
      .body{font-size:15px}
      .label{font-size:14px;font-weight:600}
      .title{font-size:28px;font-weight:700}
      .section{font-size:18px;font-weight:700}
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="70" fill="#0B1016"/>
  <line x1="0" y1="70" x2="1600" y2="70" stroke="#1E2933"/>

  <g class="ui">
    <text x="28" y="43" class="white" font-size="18" font-weight="700">VIDO</text>
    <rect x="91" y="22" width="1" height="26" fill="#26323D"/>
