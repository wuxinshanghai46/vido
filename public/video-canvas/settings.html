<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视频画布设置</title><link rel="stylesheet" href="/css/video-canvas/core.css?v=20260716-v2"></head><body><div class="vc-app"><header data-vc-topbar></header><main class="vc-main"><section class="vc-page-head"><div><h1>画布设置</h1><p>仅影响视频画布，不影响新剧情广告或其他模块。</p></div></section><div class="vc-card" style="max-width:720px"><form id="settings-form"><div class="vc-field"><label>默认质量档位</label><select class="vc-select" name="quality"><option value="preview">预览档（低成本）</option><option value="final">成片档（高质量）</option></select></div><div class="vc-field" style="margin-top:16px"><label>单次最高费用（美元）</label><input class="vc-input" name="maxCostUsd" type="number" min="0" step="0.1"></div><div class="vc-field" style="margin-top:16px"><label>自动重试次数</label><select class="vc-select" name="autoRetry"><option value="0">0 次（推荐）</option><option value="1">1 次，仅可安全重试错误</option></select></div><div class="vc-field" style="margin-top:16px"><label>个人生成并发</label><input class="vc-input" name="concurrency" type="number" min="1" max="4"></div><div class="vc-actions" style="margin-top:22px"><button class="vc-button primary" type="submit">保存设置</button></div></form></div></main></div><script src="/js/auth.js?v=20260626-long-session"></script><script type="module" src="/js/video-canvas/pages/settings.js?v=20260716-v2"></script></body></html>
