<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视频画布编辑器</title><link rel="stylesheet" href="/css/video-canvas/core.css?v=20260716-v2"><link rel="stylesheet" href="/css/video-canvas/editor.css?v=20260717-v3"></head><body class="vc-editor-page"><div class="vc-app"><header class="vc-topbar"><a class="vc-brand" href="/video-canvas/"><i>V</i><span>视频画布</span></a><input class="vc-editor-title" id="project-title" value="未命名视频项目" aria-label="项目名称"><span class="vc-save-state" id="save-state">准备中</span><span class="vc-spacer"></span><div class="vc-actions"><a class="vc-button" href="/video-canvas/" aria-label="返回视频画布项目列表">← 返回</a><button class="vc-button" id="save-button">保存</button><button class="vc-button" id="layout-button">整理</button><button class="vc-button primary" id="run-button">▶ 预检并运行</button><a class="vc-button" href="/video-canvas/tasks.html">任务</a></div></header><main class="vc-editor-shell"><aside class="vc-editor-side"><div class="vc-side-head"><h2>节点与模板</h2></div><div class="vc-side-body"><div class="vc-field"><input class="vc-input" id="node-search" placeholder="搜索节点"></div><div id="node-library"></div><div class="vc-section"><button class="vc-button" style="width:100%" id="template-button">从模板创建</button></div></div></aside><section class="vc-canvas-wrap" id="canvas-wrap"><div class="vc-canvas-stage" id="canvas-stage"><svg class="vc-edge-layer" id="edge-layer"></svg><div id="node-layer"></div></div><div class="vc-empty-canvas" id="empty-canvas" role="status" hidden><div><b>从左侧添加第一个节点</b><span>点击输出端口，再点击输入端口即可连线</span></div></div><div class="vc-canvas-toolbar"><button id="zoom-out">−</button><span id="zoom-label">100%</span><button id="zoom-in">＋</button><button id="fit-button">适应</button></div><div class="vc-connection-hint" id="connection-hint" hidden>请选择目标输入端口 · Esc 取消</div></section><aside class="vc-editor-side right" id="property-side"><div class="vc-side-head"><h2>节点属性</h2></div><div class="vc-side-body" id="property-panel"><div class="vc-property-empty">选择一个节点查看和编辑属性</div></div><div class="vc-run-summary" id="run-summary"><small>当前版本尚未运行</small></div></aside></main></div><div class="vc-modal" id="plan-modal" hidden><div class="vc-modal-card"><div class="vc-modal-head"><div><span class="vc-kicker">执行计划</span><h2>确认本次运行</h2></div><button class="vc-modal-close" data-close-plan>×</button></div><div id="plan-content"></div><div class="vc-actions" style="justify-content:flex-end;margin-top:18px"><button class="vc-button" data-close-plan>取消</button><button class="vc-button primary" id="confirm-run">确认并运行</button></div></div></div><script src="/js/auth.js?v=20260626-long-session"></script><script type="module" src="/js/video-canvas/pages/editor.js?v=20260716-v2"></script></body></html>
