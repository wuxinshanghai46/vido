<!doctype html><html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIDO C端作品首页 B版</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);transition:.2s}html[data-theme=light]{--bg:#fafbfe;--surface:#fff;--text:#171b2b;--muted:#7c8498;--line:#e9ecf3;--accent:#625df6;--soft:#f2f3f9;--shadow:0 16px 45px rgba(39,49,90,.08)}html[data-theme=dark]{--bg:#11131a;--surface:#1b1e28;--text:#f4f5fb;--muted:#979daf;--line:#2c303d;--accent:#8985ff;--soft:#232733;--shadow:0 18px 50px rgba(0,0,0,.28)}button{font:inherit}.bar{height:64px;display:flex;align-items:center;padding:0 30px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:10}.brand{font-weight:900;font-size:19px;display:flex;gap:10px;align-items:center}.logo{width:33px;height:33px;display:grid;place-items:center;border-radius:10px;color:white;background:linear-gradient(135deg,#536fff,#49d6b4)}.nav{margin-left:45px;display:flex;gap:25px}.nav button{padding:21px 0 18px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);cursor:pointer}.nav button.active{color:var(--text);border-color:var(--accent)}.bar-right{margin-left:auto;display:flex;gap:10px;align-items:center}.round{width:37px;height:37px;border:1px solid var(--line);border-radius:50%;background:var(--surface);color:var(--text);cursor:pointer}.user{position:relative;width:37px;height:37px;border:0;border-radius:50%;color:white;background:linear-gradient(135deg,#6a62fa,#52cbb4)}.user:after{content:"";position:absolute;width:8px;height:8px;right:-1px;top:0;border-radius:50%;background:#ff5a63;border:2px solid var(--surface)}
main{max-width:1340px;margin:auto;padding:35px 30px 70px}.hello{display:flex;align-items:flex-end;justify-content:space-between}.hello h1{font-size:28px;letter-spacing:-.6px;margin:0 0 6px}.hello p{margin:0;color:var(--muted)}.all-tools{border:0;background:none;color:var(--accent);cursor:pointer}.resume{margin:28px 0 42px}.resume-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:13px}.resume-head h2{font-size:16px;margin:0 0 5px}.resume-head p{margin:0;color:var(--muted);font-size:12px}.resume-list{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.resume-card{min-width:0;display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:13px;padding:15px;border:1px solid var(--line);border-radius:17px;background:var(--surface);box-shadow:0 8px 26px rgba(39,49,90,.04)}.resume-icon{width:48px;height:48px;display:grid;place-items:center;border-radius:15px;font-size:22px;background:linear-gradient(145deg,#edeaff,#dcd9ff)}.resume-card:nth-child(2) .resume-icon{background:linear-gradient(145deg,#e0f8f1,#c5eee2)}.resume-card:nth-child(3) .resume-icon{background:linear-gradient(145deg,#fff1df,#ffe0b7)}.resume-info{min-width:0}.resume-info small{display:block;color:var(--muted);font-size:10px;margin-bottom:4px}.resume-info b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.resume-step{display:flex;align-items:center;gap:5px;margin-top:6px;color:var(--muted);font-size:10px}.resume-step i{width:6px;height:6px;border-radius:50%;background:#6f6af8}.continue-btn{border:0;border-radius:12px;padding:9px 12px;background:var(--soft);color:var(--text);cursor:pointer;font-weight:700;font-size:12px;white-space:nowrap}.continue-btn:hover{background:var(--accent);color:#fff}
.head{display:flex;align-items:end;justify-content:space-between;margin-bottom:15px}.head h2{font-size:20px;margin:0 0 5px}.head p{margin:0;font-size:12px;color:var(--muted)}.tabs{display:flex;gap:5px}.tabs button{border:0;border-radius:15px;padding:7px 11px;color:var(--muted);background:transparent;cursor:pointer}.tabs button.active{background:var(--soft);color:var(--text)}
.recent{display:grid;grid-template-columns:1.55fr 1fr 1fr;grid-template-rows:160px 160px;gap:12px}.work{position:relative;overflow:hidden;border:0;border-radius:20px;color:white;text-align:left;cursor:pointer;padding:18px;background:#425074;transition:.2s}.work:first-child{grid-row:1/3;background:linear-gradient(145deg,#3f466a,#936f99)}.work:nth-child(2){background:linear-gradient(145deg,#225567,#53a990)}.work:nth-child(3){background:linear-gradient(145deg,#85502f,#d89858)}.work:nth-child(4){background:linear-gradient(145deg,#51447c,#8974ce)}.work:nth-child(5){background:linear-gradient(145deg,#30526d,#618fba)}.work:before{content:"";position:absolute;width:170px;height:170px;border:30px solid rgba(255,255,255,.09);right:-60px;top:-65px;border-radius:50%}.work:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 30%,rgba(8,10,20,.62))}.work:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.work .tag{position:relative;z-index:2;font-size:10px;padding:5px 8px;border-radius:10px;background:rgba(255,255,255,.16)}.duration{position:absolute;z-index:3;right:14px;top:14px;padding:4px 7px;border-radius:7px;background:rgba(12,15,26,.55);font-size:10px}.work-info{position:absolute;z-index:2;left:18px;right:58px;bottom:17px}.work-info b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.work:first-child .work-info b{font-size:21px}.work-info small{display:block;color:rgba(255,255,255,.72);margin-top:6px}.play{position:absolute;z-index:3;right:16px;bottom:16px;width:36px;height:36px;border:0;border-radius:50%;background:rgba(255,255,255,.92);color:#24283b;cursor:pointer}.toast{position:fixed;left:50%;bottom:25px;opacity:0;transform:translate(-50%,15px);transition:.2s;padding:10px 16px;border-radius:11px;background:#202333;color:#fff;z-index:50}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:950px){.resume-list{grid-template-columns:1fr}.recent{grid-template-columns:1fr 1fr}.work:first-child{grid-column:1/3}}@media(max-width:620px){.bar{padding:0 15px}.nav{display:none}main{padding:24px 15px 55px}.hello h1{font-size:23px}.resume{margin-top:22px}.resume-list{display:flex;overflow:auto;scroll-snap-type:x mandatory;margin-right:-15px;padding-right:15px}.resume-card{min-width:310px;scroll-snap-align:start}.resume-info b{max-width:145px}.recent{display:flex;overflow:auto;scroll-snap-type:x mandatory;margin-right:-15px;padding-right:15px}.work,.work:first-child{min-width:280px;height:190px;scroll-snap-align:start}.tabs{display:none}}
</style><script src="/js/media-delivery.js?v=20260714-platform-media-v2"></script></head><body>
<header class="bar"><div class="brand"><div class="logo">V</div>VIDO</div><nav class="nav"><button class="active">首页</button><button>我的创作</button><button>模板</button><button>素材</button></nav><div class="bar-right"><button class="round" id="theme">☀︎</button><button class="round">⌕</button><button class="user">A</button></div></header>
<main><section class="hello"><div><h1>下午好，admin</h1><p>从哪里继续？</p></div><button class="all-tools">查看全部工具 →</button></section>
<section class="resume"><div class="resume-head"><div><h2>继续制作</h2><p>你有 3 个尚未完成的任务</p></div><button class="all-tools" id="all-unfinished">查看全部未完成 →</button></div><div class="resume-list"><article class="resume-card"><div class="resume-icon">🎭</div><div class="resume-info"><small>剧情广告 · 3小时前</small><b>不锈钢背景墙品牌短片</b><span class="resume-step"><i></i>分镜生成</span></div><button class="continue-btn" data-task="不锈钢背景墙品牌短片">继续</button></article><article class="resume-card"><div class="resume-icon">🧑‍💼</div><div class="resume-info"><small>数字人口播 · 昨天</small><b>夏季新品发布口播</b><span class="resume-step"><i></i>配音设置</span></div><button class="continue-btn" data-task="夏季新品发布口播">继续</button></article><article class="resume-card"><div class="resume-icon">🎬</div><div class="resume-info"><small>视频动漫 · 2天前</small><b>机械猫城市冒险</b><span class="resume-step"><i></i>画面生成</span></div><button class="continue-btn" data-task="机械猫城市冒险">继续</button></article></div></section>
<section><div class="head"><div><h2>我的视频</h2><p>查看和播放你已经制作完成的视频</p></div><div class="tabs"><button class="active" data-filter="全部">全部</button><button data-filter="剧情广告">剧情广告</button><button data-filter="数字人">数字人</button></div></div><div class="recent"><article class="work" data-type="剧情广告"><span class="tag">剧情广告</span><span class="duration">00:30</span><div class="work-info"><b>不锈钢背景墙 · 品牌剧情广告</b><small>今天 15:26</small></div><button class="play" aria-label="播放不锈钢背景墙品牌剧情广告">▶</button></article><article class="work" data-type="剧情广告"><span class="tag">剧情广告</span><span class="duration">00:30</span><div class="work-info"><b>企业知识库软件短片</b><small>昨天 18:40</small></div><button class="play" aria-label="播放企业知识库软件短片">▶</button></article><article class="work" data-type="数字人"><span class="tag">数字人</span><span class="duration">00:45</span><div class="work-info"><b>夏季新品发布口播</b><small>昨天 11:15</small></div><button class="play" aria-label="播放夏季新品发布口播">▶</button></article><article class="work" data-type="视频动漫"><span class="tag">视频动漫</span><span class="duration">01:12</span><div class="work-info"><b>机械猫城市冒险</b><small>7月9日</small></div><button class="play" aria-label="播放机械猫城市冒险">▶</button></article><article class="work" data-type="剧情广告"><span class="tag">剧情广告</span><span class="duration">00:20</span><div class="work-info"><b>夏日轻饮新品短片</b><small>7月8日</small></div><button class="play" aria-label="播放夏日轻饮新品短片">▶</button></article></div></section></main><div class="toast" id="toast"></div>
<script>const html=document.documentElement,t=document.getElementById('toast');function say(x){t.textContent=x;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),1500)}const saved=localStorage.getItem('vido-c-v2-theme');if(saved)html.dataset.theme=saved;const theme=document.getElementById('theme');function sync(){theme.textContent=html.dataset.theme==='dark'?'☾':'☀︎'}sync();theme.onclick=()=>{html.dataset.theme=html.dataset.theme==='dark'?'light':'dark';localStorage.setItem('vido-c-v2-theme',html.dataset.theme);sync()};document.querySelectorAll('.continue-btn').forEach(b=>b.onclick=()=>say('继续制作「'+b.dataset.task+'」'));document.getElementById('all-unfinished').onclick=()=>say('查看全部未完成任务');document.querySelectorAll('.work').forEach(b=>b.onclick=()=>say('播放「'+b.querySelector('b').textContent+'」'));document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');const filter=b.dataset.filter;document.querySelectorAll('.work').forEach(card=>card.hidden=filter!=='全部'&&card.dataset.type!==filter);say('已切换到'+b.textContent)});</script></body></html>
